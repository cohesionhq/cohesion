name: Idea
description: Suggest something Cohesion could do.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The job you want done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like it to work. Sketches and examples are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now
      description: Any workaround or other tool you use instead.
