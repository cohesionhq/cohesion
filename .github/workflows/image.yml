# Builds the daemon image for a version tag, vXXXYYYYY, and pushes it tagged
# with it. The Release workflow calls it after scripts/release.sh makes the tag;
# a tag pushed by hand starts it too. See "Publish an image" in CONTRIBUTING.md.
name: Image

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      version:
        description: The version tag to build, such as v00100042.
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]{8}$ ]]; then
            echo "::error::'$VERSION' isn't a version tag like v00100042"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Called from Release, the run's ref is master, so check out the tag itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.version }}
          persist-credentials: false

      - name: Read the commit
        id: commit
        run: |
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'subject=%s\n' "$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cohesionhq/cohesion:${{ steps.version.outputs.version }}
          build-args: COHESION_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=${{ steps.commit.outputs.subject }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # One plain amd64 manifest, as scripts/publish-image.sh pushes.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
