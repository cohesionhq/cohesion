# Builds the daemon image on every push to master and pushes it tagged with its
# version, vXXXYYYYY: XXX is MAJOR_VERSION and YYYYY counts the commits since it
# last changed. See "Publish an image" in CONTRIBUTING.md.
name: Image

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The minor version counts commits, so it needs the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the version
        id: version
        run: |
          major="$(tr -d '[:space:]' < MAJOR_VERSION)"
          if ! [[ "$major" =~ ^[0-9]{3}$ ]]; then
            echo "::error file=MAJOR_VERSION::MAJOR_VERSION must be three digits, not '$major'"
            exit 1
          fi
          minor="$(git rev-list --count "$(git log -1 --format=%H -- MAJOR_VERSION)..HEAD")"
          if (( minor > 99999 )); then
            echo "::error::Minor version $minor doesn't fit in a version's five digits"
            exit 1
          fi
          printf 'version=v%s%05d\n' "$major" "$minor" >> "$GITHUB_OUTPUT"
          printf 'subject=%s\n' "$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cohesionhq/cohesion:${{ steps.version.outputs.version }}
          build-args: COHESION_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=${{ steps.version.outputs.subject }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # One plain amd64 manifest, as scripts/publish-image.sh pushes.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
