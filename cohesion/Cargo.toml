[package]
name = "cohesion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
cohesion-core.workspace = true
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
jiff.workspace = true
mime_guess = "2.0.5"
reqwest = { workspace = true, features = ["rustls", "http2", "json"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "io-std", "time", "signal"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "__rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
